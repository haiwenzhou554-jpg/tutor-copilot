<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tutor Copilot" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
  <title>Tutor Copilot</title>
</head>
<body>
  <main class="app-shell">
    <section class="card hero">
      <div>
        <p class="eyebrow">Tutor Copilot · MVP 0.2B</p>
        <h1>实时课堂字幕</h1>
        <p class="sub">浏览器语音识别 → FastAPI · 无需 GPT API</p>
      </div>
      <div id="statusDot" class="status-dot idle"></div>
    </section>

    <section class="card">
      <p class="label">兼容性检查</p>
      <p class="hint">请用 Android Chrome 打开。微信内置浏览器可能不支持语音识别。</p>
      <button id="testBtn" class="secondary">测试服务器和浏览器</button>
    </section>

    <section class="card live-card">
      <div class="row between">
        <div>
          <p class="label">课堂监听</p>
          <p id="connectionText" class="big-status">未开始</p>
        </div>
        <span id="timer">00:00</span>
      </div>

      <div class="meter"><div id="meterFill"></div></div>

      <button id="startBtn" class="primary">🎙️ 开始实时字幕</button>
      <button id="stopBtn" class="danger" disabled>■ 停止</button>
    </section>

    <section class="card transcript-card">
      <div class="row between">
        <p class="label">实时字幕</p>
        <button id="clearTranscriptBtn" class="text-btn">清空</button>
      </div>
      <div id="transcriptBox" class="transcript-box">
        <div id="transcriptFinal" class="transcript-final"></div>
        <div id="transcriptPartial" class="transcript-partial">等待语音…</div>
      </div>
    </section>

    <section class="card stats">
      <div><span>已发送</span><strong id="chunks">0</strong></div>
      <div><span>后端确认</span><strong id="bytes">0 条</strong></div>
      <div><span>识别方式</span><strong id="mime">-</strong></div>
    </section>

    <section class="card log-card">
      <div class="row between"><p class="label">调试日志</p><button id="clearBtn" class="text-btn">清空</button></div>
      <pre id="log"></pre>
    </section>

    <p class="privacy">浏览器语音识别在部分浏览器中会把音频发送给浏览器厂商的在线识别服务；真实课堂测试前请确保参与者知情并同意。</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
