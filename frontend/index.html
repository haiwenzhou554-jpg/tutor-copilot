<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tutor Copilot" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
  <title>Tutor Copilot</title>
</head>
<body>
  <main class="app-shell">
    <section class="card hero">
      <div>
        <p class="eyebrow">Tutor Copilot · MVP 0.3.1</p>
        <h1>自托管实时字幕</h1>
        <p class="sub">先确认麦克风真的有声音，再进入 ASR。</p>
      </div>
      <div id="statusDot" class="status-dot idle"></div>
    </section>

    <section class="card">
      <p class="label">麦克风输入</p>
      <select id="micSelect"></select>
      <button id="refreshMicsBtn" class="secondary">刷新麦克风列表</button>

      <div class="input-diagnostic">
        <div class="row between">
          <span>输入音量</span>
          <strong id="clientRms">RMS 0.00000</strong>
        </div>
        <div class="meter"><div id="meterFill"></div></div>
        <p class="hint">说话时绿色条必须明显跳动，RMS 不能一直是 0。</p>
      </div>
    </section>

    <section class="card">
      <p class="label">ASR 服务器</p>
      <p class="hint">Paraformer 模型运行在 Railway 后端，不依赖 GPT API。</p>
      <button id="testBtn" class="secondary">测试模型是否加载</button>
    </section>

    <section class="card live-card">
      <div class="row between">
        <div>
          <p class="label">课堂监听</p>
          <p id="connectionText" class="big-status">未开始</p>
        </div>
        <span id="timer">00:00</span>
      </div>

      <button id="startBtn" class="primary">🎙️ 开始实时字幕</button>
      <button id="stopBtn" class="danger" disabled>■ 停止</button>
    </section>

    <section class="card transcript-card">
      <div class="row between">
        <p class="label">实时字幕</p>
        <button id="clearTranscriptBtn" class="text-btn">清空</button>
      </div>
      <div id="transcriptBox" class="transcript-box">
        <div id="transcriptFinal" class="transcript-final"></div>
        <div id="transcriptPartial" class="transcript-partial">等待语音…</div>
      </div>
    </section>

    <section class="card stats">
      <div><span>PCM 块</span><strong id="chunks">0</strong></div>
      <div><span>已发送</span><strong id="bytes">0 KB</strong></div>
      <div><span>格式</span><strong id="mime">-</strong></div>
    </section>

    <section class="card log-card">
      <div class="row between">
        <p class="label">调试日志</p>
        <button id="clearBtn" class="text-btn">清空</button>
      </div>
      <pre id="log"></pre>
    </section>

    <p class="privacy">真实课堂测试前，请确保所有录音参与者知情并同意。</p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
